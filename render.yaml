services:
  - type: web
    name: open-agent
    runtime: docker
    plan: free

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: true
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_PLAN_MODEL
        value: gemini-2.5-flash

      - key: OPENROUTER_API_KEY_1
        sync: true
      - key: OPENROUTER_API_KEY_2
        sync: true
      - key: OPENROUTER_API_KEY_3
        sync: true

      - key: GITHUB_TOKEN
        sync: true

      # Coding model used only by the Work Mode mini-SWE-agent engine.
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-4.6

      # Protects existing native-Python Render services that have not yet
      # been switched to the Docker runtime defined above.
      - key: PYTHON_VERSION
        value: "3.12.3"

      - key: MAX_AGENT_ITERATIONS
        value: "20"

      - key: MAX_TEST_ITERATIONS
        value: "5"

      - key: WORKSPACE_TIMEOUT
        value: "600"

      - key: COMMAND_TIMEOUT
        value: "180"

      - key: AUTO_PUSH
        value: "false"

      - key: FRONTEND_ORIGINS
        sync: true

      - key: MAX_UPLOAD_SIZE
        value: "52428800"

      - key: MAX_ZIP_FILES
        value: "10000"

      - key: MAX_ZIP_UNCOMPRESSED_SIZE
        value: "524288000"

      - key: SESSION_TTL
        value: "3600"
