services:
  - type: web
    name: open-agent
    runtime: docker
    plan: free

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: true

      - key: GITHUB_TOKEN
        sync: true

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: MAX_AGENT_ITERATIONS
        value: "20"

      - key: MAX_TEST_ITERATIONS
        value: "5"

      - key: WORKSPACE_TIMEOUT
        value: "600"

      - key: COMMAND_TIMEOUT
        value: "180"

      - key: AUTO_PUSH
        value: "true"

      - key: FRONTEND_ORIGINS
        value: "*"
